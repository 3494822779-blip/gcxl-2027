# ============================================================================
# 统一参数配置文件
#
# 工作区内所有节点的全部运行参数集中在本文件，每个节点只读取与自己
# 同名的小节（camera / detector / tracker / filter / alignment / gripper /
# display / serial_node / selector）。
#
# 使用：ros2 launch block_perception perception.launch.py [params:=<其他yaml>]
#       修改本文件后需重新 colcon build（安装目录中的副本不会自动更新）。
#
# 标注"启动时固定"的参数在节点构造时读取，运行中 ros2 param set 无效；
# 其余算法参数可在线修改，回调立即校验并生效（见 ros2_ws/README.md 在线调参）。
#
# 开关类选项（camera / detector / tracker / display / serial / use_sim_time）
# 仍是 launch 参数，因为它们决定启动哪些进程，不属于节点参数。
#
# 本文件中的绝对路径在迁移目录后需同步修改并重新编译。
# ============================================================================

# ---------- 图像尺寸 ----------
# camera、detector、tracker 三段必须一致，launch 启动时校验；width 必须能被 4 整除。

camera:                            # 仅 camera:=true 时启动（内置 USB/视频文件相机）
  ros__parameters:
    source: /dev/video0            # 启动时固定；USB 设备或视频文件绝对路径
    width: 640                     # 启动时固定；VGA 640x480
    height: 480                    # 启动时固定；4:3
    fps: 120.0                     # 启动时固定；MJPG 640x480 相机标称120，OpenCV 实测约99fps
    frame_id: camera_optical_frame # 启动时固定

detector:                          # DeepStream nvinfer/TensorRT，发布 /detections
  ros__parameters:
    width: 640                     # 启动时固定；与相机一致
    height: 480                    # 启动时固定
    confidence_threshold: 0.75     # 在线可调 [0.01, 1]；轻微降低以平衡高分辨率下的检测
                                   # 不要在 infer 配置里调高，否则降低本阈值不能恢复已丢弃的框
    config_file: /home/nvidia/project/gcxl-2027/ros2_ws/src/block_perception/config/infer_blocks.txt
                                   # 启动时固定；ONNX/engine/标签/parser 路径及 NMS 参数

tracker:                           # DeepStream nvtracker/NvDCF，发布 /tracks
  ros__parameters:
    width: 640                     # 启动时固定；匹配相机分辨率
    height: 480                    # 启动时固定
    config_file: /home/nvidia/project/gcxl-2027/ros2_ws/src/block_perception/config/tracker_blocks.yml
                                   # 启动时固定；NvDCF 匹配/状态估计参数
    tracker_library: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
                                   # 启动时固定；nvtracker 插件库
    tracker_width: 640             # 启动时固定；nvtracker 内部处理宽度
    tracker_height: 480            # 启动时固定；与输入一致（须为32的倍数）

# ---------- 算法参数（在线可调） ----------

first_grasp:                       # 独立首次抓取任务
  ros__parameters:
    first_grasp_overlap: 0.0       # 首次抓取：上方区域与 class_1 交集 / class_1 框面积的最大值，[0,1)

selector:                          # 目标选择与锁定
  ros__parameters:
    rebind_iou: 0.3                # [0, 1]；锁定的 ID 消失后，同类别、与最后位置框的 IoU 不低于此值的新 ID 视为同一个物块并接管；0=关闭
    rebind_timeout: 3.0            # 秒；最后一次看到锁定目标之后，超过此时长不再接管新 ID

filter:                            # 卡尔曼滤波，状态 [x, y, vx, vy]，像素坐标、秒
  ros__parameters:
    process_noise: 400.0           # 加速度噪声方差 (px²/s⁴)
    measurement_noise: 50.0        # 中心点观测噪声方差 (px²)
    initial_variance: 100.0        # 初始协方差对角项
    prediction_timeout: 0.8        # 秒；目标漏检但图像仍到达时预测，超过此时长输出 invalid

alignment:                         # 对准指令，20 Hz 发布 /alignment/command
  ros__parameters:
    camera_servo: true             # 相机俯仰舵机边前进边转向偏弱开关（须与 actuator 一致）。false=相机固定：只靠底盘前进把框下边缘
                                   # 带进画面下部区间；true=舵机俯仰对准，前进到相机低到 grasp_pitch 为止
    deadzone_x: 0.04               # 归一化死区 [0, 1)；error_x=(框中心x-W/2)/(W/2)，正值=目标在右侧
    deadzone_y: 0.1                # error_y=(框下边缘y-bottom_target*H)/(H/2)，正值=下边缘偏下；
                                   # 目标线上下各 5% 画面高度，增加容忍度避免抖动重置hold_time
    bottom_target: 0.8             # 下边缘目标位置（占画面高度比例），0.9±0.1 = 画面下部 20% 区间
    forward_speed: 0.5             # m/s（×wheel_speed_scale=1000 → 下位机收到 500）；舵机关：下边缘在目标带上方（物块还远）时前进，带下方只停车不倒车；
                                   # 舵机开：相机尚未低到 grasp_pitch 时前进
    forward_max_error_x: 0.3       # 水平偏差超过此值（归一化）时不前进，先转向
    grasp_error_x: 0.15            # 物块到达下边缘目标线时的水平死区（归一化）；远处用 deadzone_x，越近越宽，线性过渡
    yaw_near_weight: 0.2           # [0, 1]；转向增益权重：远处=1（全增益，前期转到位），越近越小，最低到此值（到达目标线时）
    yaw_center_weight: 0.3         # [0, 1]；转向增益的偏离权重下限：目标在画面中心附近时增益只剩这个比例（防小偏差来回摆）
    yaw_full_error_x: 0.7          # (0, 1]；|error_x| 达到此值（归一化）及以上时偏离权重=1（全增益），之间线性过渡
    yaw_gain: -1.25               # rad/s 每单位归一化误差。负值：目标在右（error_x>0）→ yaw<0 → 左轮比右轮快 → 车向右转。
                                   # 已实测 lw=左轮、正=前进；右轮对应关系待确认。
                                   # 原地转向每侧轮速 = yaw × track_width/2 × wheel_speed_scale，-2.0/2.0 时误差满幅 → ±200
    pitch_gain: 1.5                # 正角度=低头；仅 camera_servo=true 时有效
    max_yaw_rate: 2.0              # rad/s 限幅；原地转向时左右轮各 ±200（track_width=0.2、scale=1000）
    max_pitch_rate: 0.6            # rad/s（约 34.4°/s）；20 Hz 下每周期最大调整约 1.72°
    grasp_pitch: 0.6981              # rad（约 +50°）；正角度=低头；到达此角度并稳定后
                                   # 触发夹爪闭合。须与 actuator 的 grasp_pitch_deg 同一角度（单位不同），
                                   # 且须在相机可达范围 [cam_min_deg, cam_max_deg] 内；按实际抓取姿态标定
    pitch_timeout: 0.25            # 秒；pitch 反馈过期判定（仅 camera_servo=true）
    input_timeout: 0.25            # 秒；目标消息过期判定，同时写入 valid_for_sec 供消费者检查
    hold_seconds: 0.15             # 秒；水平和下边缘都在死区内 + 真实观测（舵机开时还要相机低头到 grasp_pitch）
                                   # 持续此时长后发出一次抓取请求（降低以便更容易触发）
    pitch_joint: camera_pitch      # 订阅 /camera/joint_states 中的关节名（仅 camera_servo=true）

gripper:                           # 框左右边缘 -> 夹爪张开角（发布 /gripper/angles，由 actuator 下发串口）
  ros__parameters:
    input_timeout: 0.25            # 秒；目标/图像过期判定
    claw_init_deg: 0.0             # 夹爪初始角（合拢位置）；只能从此角向外张开，不会低于它（须与 actuator 一致）
    claw_max_deg: 90.0             # 夹爪最大张开角（须与 actuator 一致）
    claw_margin_mm: 5.0            # 在物体宽度 d 上再加的余量 (mm)
    mm_per_px: 0.24                 # d = mm_per_px × 框宽(px) + claw_margin_mm；需按实物标定
    # 张开角 = -Δθ，Δθ = link_ref_deg - arccos((link_offset - d/2) / link_length)
    # 夹爪舵机角 = claw_init_deg + 张开角，限幅在 [claw_init_deg, claw_max_deg]
    link_ref_deg: 60.0
    link_offset: 44.0              # 与 d 同单位 (mm)
    link_length: 91.0

actuator:                          # 控制量 -> 串口指令（serial_tx），20 Hz
  ros__parameters:
    camera_servo: true             # 相机俯仰舵机开关（须与 alignment 一致）。false 时 CMD 的相机角度固定发
                                   # camera_fixed_deg，不处理 $FB，抓取时夹爪立刻合拢
    camera_fixed_deg: 0.0          # camera_servo=false 时发给下位机的固定相机角度（度）
    track_width: 0.15               # m；两轮间距，用于差速换算
    wheel_speed_scale: 100.0      # 发给下位机的轮速原始值 = m/s × 此系数（0.5 m/s → 500）
    max_wheel_speed: 0.5           # m/s 限幅，×scale 即下位机收到的轮速上限
    min_turn_speed: 0.17            # m/s；只要有转向指令，每侧轮子的转向分量至少这么大（×scale 即下位机收到的值），
                                   # 避免小偏差时左右轮差太小、电机不动；0 = 关闭
    cam_min_deg: 0.0               # 相机舵机角度指令下限（度，0=回正）
    cam_max_deg: 90.0              # 上限（度，正=低头）；alignment 的俯仰速度在此范围内积分成角度
    grasp_pitch_deg: 40.0           # 抓取时相机先低头到的目标角（度，正=低头），到位后夹爪才合拢；
                                   # 须与 alignment 的 grasp_pitch 同一角度（15° = 0.26 rad），
                                   # 且须在 [cam_min_deg, cam_max_deg] 内；按实际抓取姿态标定
    grasp_pitch_tol: 0.06          # rad；相机到达 grasp_pitch_deg 的到位容差（约 1.7°）
    claw_init_deg: 0.0             # 夹爪初始角（合拢位置，须与 gripper 一致）
    claw_max_deg: 90.0
    left_claw_close_deg: 0.0       # 长期配置：抓取时左夹爪闭合角，度
    right_claw_close_deg: 5.0      # 长期配置：抓取时右夹爪闭合角，暂定0度，可单独调整
                                   # 两者均须在 [claw_init_deg, claw_max_deg]；临时开爪不覆盖此配置
    pitch_home: 0.0                # rad；抓取时相机回正的初始角
    pitch_home_tol: 0.03           # rad；回正到位容差
    discard_enabled: true          # 抓取合拢后自动执行丢弃，结束后停车
    discard_distance_m: 0.2         # x，米：后退及返回前进的距离，均使用此值
    discard_speed_mps: 0.1          # 后退/前进速度，m/s
    discard_turn_speed_mps: 0.17    # 原地旋转每侧轮速，m/s；受 min_turn_speed/max_wheel_speed 限制
                                   # 无里程计反馈：90°按轮距和实际下发轮速计时，距离按速度计时，需实车标定
    claw_settle_sec: 0.5           # 夹爪合拢及每次打开后的等待时间（秒）
    claw_deadband_deg: 2.0         # 度；跟踪阶段夹爪目标变化不超过此值时不下发，抑制框宽抖动引起的舵机抖动
    pitch_timeout: 0.25            # 秒；pitch 反馈过期判定
    pitch_joint: camera_pitch

display:                           # OpenCV 屏幕显示窗口（无图形桌面时用 display:=false 关闭）
  ros__parameters:
    window: block_perception

# ---------- 串口桥 ----------

serial_node:                       # serial_minimal 包；launch 默认不启动，加 serial:=true
  ros__parameters:
    port: /dev/ttyACM0             # 启动时固定；节点启动即打开该串口，无设备时会退出
    baud: 115200                   # 启动时固定；仅支持 9600/19200/38400/57600/115200
    poll_period: 0.01              # 启动时固定；读轮询周期（秒）
